name: Roblox Radarı

on:
  schedule:
    - cron: "13 6 * * *"     # her gün 09:13 (Türkiye saati)
  workflow_dispatch:           # elle çalıştırma butonu

permissions:
  contents: write              # gönderilen liste ve takip listesi kaydı için

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python roblox_radar.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Gönderilen listeyi kaydet
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add sent_roblox.json watch_channels.json
          git diff --cached --quiet || (git commit -m "roblox listesi güncellendi" && git pull --rebase && git push)
