name: Saatlik Trend Shorts

on:
  schedule:
    - cron: "7 * * * *"   # her saat başı (7. dakikada)
  workflow_dispatch:       # elle çalıştırma butonu

permissions:
  contents: write          # gönderilen video listelerini (sent*.json) kaydetmek için

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python trend_bot.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOKEN_SMALL: ${{ secrets.TG_TOKEN_SMALL }}
      - name: Gönderilen listeleri kaydet
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add sent*.json
          git diff --cached --quiet || (git commit -m "gönderilen videolar güncellendi" && git push)
